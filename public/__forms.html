<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procus website forms</title>
</head>
<body>
  <form
    name="contact"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="subject" value="New enquiry from the Procus website">
    <input name="bot-field">
    <input name="first_name" type="text">
    <input name="last_name" type="text">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <textarea name="message"></textarea>
  </form>

  <form
    name="careers"
    method="POST"
    enctype="multipart/form-data"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="careers">
    <input type="hidden" name="subject" value="New career application from the Procus website">
    <input name="bot-field">
    <input name="name" type="text">
    <input name="specialisation" type="text">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <textarea name="message"></textarea>
    <input name="resume" type="file" accept="application/pdf">
  </form>
</body>
</html>
